        position: Research Intern
        location: Shanghai, China
        start_date: 2025-02
        end_date: 2025-10
        summary: "Team lead: Wenwei Zhang; center lead: Kai Chen. Projects: Long-Horizon Deep Search and Intern-S1."
        highlights:
          - "Deep-search agent RL: trained a dense 7B search agent end to end on the fully asynchronous AReaL RL framework, with multi-turn search-reasoning rollouts and rewards; +5% over the baseline on mainstream QA benchmarks."
          - "Agent framework and trajectory synthesis: rebuilt the multi-turn planning and retrieval logic of MindSearch and set up high-concurrency crawling and asynchronous data synthesis to produce filtered long-horizon trajectories for SFT and RL."
          - "RL infrastructure: removed redundant full-vocabulary intermediates in log-prob computation, cutting peak memory by 70%, extending per-GPU context from 8K to 32K and raising rollout throughput by 30%."
          - "Intern-S1: built a scientific QA benchmark from PubChem and UniProt with cross-database entity alignment and expert review, and a semi-automatic quality-check pipeline for annotated math data."

