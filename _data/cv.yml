        highlights:
          - "3D-scene QA data synthesis: built a programmatic pipeline on open-source 3D scene assets that automatically labels object positions, orientations, relations and distances."
          - "Spatial-reasoning post-training: post-trained VLMs on this data, improving object localization, viewpoint transformation and spatial-relation judgment by 8% over the baseline on mainstream benchmarks."

